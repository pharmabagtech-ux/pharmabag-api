name: Deploy API on EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Sync Project to EC2
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete --exclude '.env' --exclude '.git' --exclude 'node_modules' --exclude '.github'
          path: ./
          remote_path: /home/ubuntu/pharmabag-api
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}


      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/pharmabag-api

            echo "Installing dependencies..."
            npm ci

            echo "Generating Prisma Client..."
            npx prisma generate

            echo "Applying database migrations..."
            npx prisma migrate deploy

            echo "Building application..."
            npm run build

            echo "Restarting PM2..."
            pm2 restart pharmabag-api

            pm2 save

            echo "Deployment completed successfully."
